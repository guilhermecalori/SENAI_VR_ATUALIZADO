<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Core | PWA Quiosque</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@300;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        body { 
            background: #05070a; 
            font-family: 'Manrope', sans-serif; 
            color: #fff; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            user-select: none;
        }
        .glass-panel { background: rgba(18, 22, 33, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
        .typing-dot { animation: typing-blink 1s infinite; }
        @keyframes typing-blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
</head>
<body class="p-6 flex gap-6 w-full">

    <aside class="w-1/4 flex flex-col gap-4">
        <div class="glass-panel p-6 rounded-[2rem] flex items-center gap-4">
            <span class="material-symbols-outlined text-cyan-400 text-3xl">bolt</span>
            <h1 class="font-bold text-xl tracking-tighter">SPATIAL <span class="text-cyan-500">CORE</span></h1>
        </div>

        <nav class="flex-1 glass-panel rounded-[2rem] p-4 space-y-2">
            <p class="text-[10px] font-bold text-slate-500 uppercase px-4 mb-4">Ações Rápidas</p>
            <button onclick="setQuery('Como ajustar o Meta Quest 3S?')" class="w-full text-left p-4 rounded-2xl hover:bg-white/5 transition-all text-sm border border-transparent hover:border-cyan-500/30">Ajuste de Ergonomia</button>
            <button onclick="setQuery('Como limpar as lentes?')" class="w-full text-left p-4 rounded-2xl hover:bg-white/5 transition-all text-sm border border-transparent hover:border-cyan-500/30">Guia de Limpeza</button>
            <button onclick="setQuery('Alerta de luz solar')" class="w-full text-left p-4 rounded-2xl hover:bg-white/5 transition-all text-sm border border-transparent hover:border-cyan-500/30 text-orange-400">Perigo: Luz Solar</button>
        </nav>

        <button onclick="location.reload()" class="glass-panel p-5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-red-500/10 transition-all">
            <span class="material-symbols-outlined">restart_alt</span> Reiniciar Sistema
        </button>
    </aside>

    <main class="flex-1 glass-panel rounded-[2.5rem] flex flex-col overflow-hidden shadow-2xl">
        <header class="p-6 border-b border-white/5 flex justify-between items-center bg-white/2">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></div>
                <span class="text-xs font-bold uppercase tracking-widest text-emerald-500">Interface Neural Online</span>
            </div>
            <span class="text-[10px] text-slate-500 font-mono uppercase">ID: SENAI-VR-3S</span>
        </header>

        <div id="chat-box" class="flex-1 overflow-y-auto p-8 space-y-6 chat-box">
            <div class="flex gap-4 items-start">
                <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center text-cyan-400 text-[10px] font-bold">AI</div>
                <div class="bg-white/5 p-5 rounded-2xl rounded-tl-none max-w-[80%] text-sm leading-relaxed">
                    Sincronização PWA concluída. Como posso auxiliar em seu treinamento imersivo no **Meta Quest 3S**?
                </div>
            </div>
        </div>

        <div class="p-6 bg-black/20">
            <div class="relative max-w-4xl mx-auto flex gap-4">
                <input type="text" id="user-input" autocomplete="off" placeholder="Digite sua dúvida técnica..." 
                       class="flex-1 bg-slate-900 border border-white/10 rounded-2xl p-5 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500/50">
                <button onclick="sendMessage()" class="bg-cyan-600 hover:bg-cyan-400 text-slate-950 font-bold px-8 rounded-2xl transition-all">
                    Enviar
                </button>
            </div>
        </div>
    </main>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        // Atalho Enter
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const text = userInput.value.trim();
            if(!text) return;

            // 1. Balão do Usuário
            addBalloon(text, 'user');
            userInput.value = "";

            // 2. Balão de Carregamento
            const tempId = "ai-" + Date.now();
            addLoading(tempId);

            // 3. Chamada ao Back-end (api_nova.php)
            try {
                const response = await fetch('api_nova.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                updateBalloon(tempId, data.response);
